<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${spare.id == null} ? 'Nuevo Repuesto' : 'Editar Repuesto'">Repuesto | BQRINES</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-content container-fluid">

    <div class="page-header">
        <h2>
            <i class="fas fa-cog me-2"></i>
            <span th:text="${spare.id == null} ? 'Nuevo Repuesto' : 'Editar Repuesto'"></span>
        </h2>
        <a th:href="@{/inventory/spares}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i>Volver
        </a>
    </div>

    <div class="form-card">
        <form th:action="${spare.id == null} ? @{/inventory/spares/save} : @{/inventory/spares/update/{id}(id=${spare.id})}"
              th:object="${spare}" method="post">

            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label">Nombre</label>
                    <input type="text" th:field="*{name}" class="form-control"
                           placeholder="Filtro de aceite" required maxlength="150">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Referencia</label>
                    <input type="text" th:field="*{reference}" class="form-control"
                           placeholder="REF-001" required maxlength="100">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Categoría</label>
                    <input type="text" th:field="*{category}" class="form-control"
                           placeholder="Filtros" required maxlength="100">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Precio ($)</label>
                    <input type="number" th:field="*{price}" class="form-control"
                           placeholder="15.00" min="0" step="0.01" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Stock</label>
                    <input type="number" th:field="*{stock}" class="form-control"
                           placeholder="10" min="0" required>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary px-4">
                    <i class="fas fa-save me-2"></i>
                    <span th:text="${spare.id == null} ? 'Guardar' : 'Actualizar'"></span>
                </button>
                <a th:href="@{/inventory/spares}" class="btn btn-outline-secondary px-4">Cancelar</a>
            </div>
        </form>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
