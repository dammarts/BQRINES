<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${vehicle.id == null} ? 'Nuevo Vehículo' : 'Editar Vehículo'">Vehículo | BQRINES</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-content container-fluid">

    <div class="page-header">
        <h2>
            <i class="fas fa-car me-2"></i>
            <span th:text="${vehicle.id == null} ? 'Nuevo Vehículo' : 'Editar Vehículo'"></span>
        </h2>
        <a th:href="@{/inventory/vehicles}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i>Volver
        </a>
    </div>

    <div class="form-card">
        <form th:action="${vehicle.id == null} ? @{/inventory/vehicles/save} : @{/inventory/vehicles/update/{id}(id=${vehicle.id})}"
              th:object="${vehicle}" method="post">

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Marca</label>
                    <input type="text" th:field="*{brand}" class="form-control"
                           placeholder="Toyota" required maxlength="100">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Modelo</label>
                    <input type="text" th:field="*{model}" class="form-control"
                           placeholder="Corolla" required maxlength="100">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Año</label>
                    <input type="number" th:field="*{year}" class="form-control"
                           placeholder="2024" min="1900" max="2100" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Precio ($)</label>
                    <input type="number" th:field="*{price}" class="form-control"
                           placeholder="25000" min="0" step="0.01" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Stock</label>
                    <input type="number" th:field="*{stock}" class="form-control"
                           placeholder="1" min="0" required>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary px-4">
                    <i class="fas fa-save me-2"></i>
                    <span th:text="${vehicle.id == null} ? 'Guardar' : 'Actualizar'"></span>
                </button>
                <a th:href="@{/inventory/vehicles}" class="btn btn-outline-secondary px-4">Cancelar</a>
            </div>
        </form>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
