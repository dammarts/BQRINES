<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehículos | BQRINES</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-content container-fluid">

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show mb-3" role="alert">
        <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="page-header">
        <h2><i class="fas fa-car me-2"></i>Inventario de Vehículos</h2>
        <a sec:authorize="hasRole('GERENTE')" th:href="@{/inventory/vehicles/new}" class="btn btn-primary">
            <i class="fas fa-plus me-1"></i>Nuevo Vehículo
        </a>
    </div>

    <div class="table-card">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Placa</th>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>Año</th>
                        <th>Color</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Estado</th>
                        <th>Registrado</th>
                        <th sec:authorize="hasRole('GERENTE')">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(vehicles)}">
                        <td colspan="8" class="text-center text-muted py-5">
                            <i class="fas fa-car fa-2x mb-2 d-block opacity-25"></i>
                            No hay vehículos registrados.
                        </td>
                    </tr>
                    <tr th:each="v : ${vehicles}">
                        <td class="text-muted small" th:text="${v.id}"></td>
                        <td><code th:text="${v.placa != null} ? ${v.placa} : '—'"></code></td>
                        <td class="fw-semibold" th:text="${v.brand}"></td>
                        <td th:text="${v.model}"></td>
                        <td th:text="${v.year}"></td>
                        <td th:text="${v.color != null} ? ${v.color} : '—'"></td>
                        <td th:text="'$' + ${#numbers.formatDecimal(v.price, 0, 'COMMA', 0, 'POINT')}"></td>
                        <td>
                            <span th:if="${v.stock == 0}" class="stock-off" th:text="${v.stock} + ' uds.'"></span>
                            <span th:if="${v.stock > 0 and v.stock <= 3}" class="stock-low" th:text="${v.stock} + ' uds.'"></span>
                            <span th:if="${v.stock > 3}" class="stock-ok" th:text="${v.stock} + ' uds.'"></span>
                        </td>
                        <td>
                            <span th:if="${v.active}" class="badge bg-success-subtle text-success">Activo</span>
                            <span th:unless="${v.active}" class="badge bg-danger-subtle text-danger">Inactivo</span>
                        </td>
                        <td class="small text-muted">
                            <span th:if="${v.createdAt != null}"
                                  th:title="${v.updatedAt != null ? 'Editado: ' + #temporals.format(v.updatedAt, 'dd/MM/yyyy HH:mm') : 'Sin ediciones'}"
                                  th:text="${#temporals.format(v.createdAt, 'dd/MM/yyyy HH:mm')}"
                                  style="cursor:default;" data-bs-toggle="tooltip"></span>
                            <span th:if="${v.createdAt == null}">—</span>
                        </td>
                        <td sec:authorize="hasRole('GERENTE')">
                            <a th:href="@{/inventory/vehicles/edit/{id}(id=${v.id})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                <i class="fas fa-pen"></i>
                            </a>
                            <a th:href="@{/inventory/vehicles/delete/{id}(id=${v.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('¿Eliminar este vehículo?')">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));</script>
</body>
</html>
