<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg app-navbar py-2">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/dashboard}">
            <i class="fas fa-car-side me-1"></i> BQRINES
        </a>
        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#navMain"
                aria-controls="navMain" aria-expanded="false">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">
                        <i class="fas fa-tachometer-alt me-1"></i> Dashboard
                    </a>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="fas fa-boxes me-1"></i> Inventario
                    </a>
                    <ul class="dropdown-menu">
                        <li sec:authorize="hasAnyRole('GERENTE','ASESOR_COMERCIAL')">
                            <a class="dropdown-item" th:href="@{/inventory/vehicles}">
                                <i class="fas fa-car me-1"></i> Vehículos
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" th:href="@{/inventory/spares}">
                                <i class="fas fa-cog me-1"></i> Repuestos
                            </a>
                        </li>
                    </ul>
                </li>

                <li class="nav-item" sec:authorize="hasAnyRole('GERENTE','ASESOR_COMERCIAL')">
                    <a class="nav-link" th:href="@{/sells}">
                        <i class="fas fa-receipt me-1"></i> Ventas
                    </a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('GERENTE')">
                    <a class="nav-link" th:href="@{/reports}">
                        <span class="nav-alert-pos">
                            <i class="fas fa-chart-bar me-1"></i>
                            <span id="alert-count-badge"
                                  class="nav-alert-badge"
                                  th:if="${totalAlerts != null and totalAlerts > 0}"
                                  th:text="${totalAlerts}"></span>
                        </span>
                        Reportes
                    </a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('GERENTE')">
                    <a class="nav-link" th:href="@{/users}">
                        <i class="fas fa-users me-1"></i> Usuarios
                    </a>
                </li>

                <li class="nav-item" sec:authorize="hasAnyRole('GERENTE','SERVICIO_TECNICO')">
                    <a class="nav-link" th:href="@{/service-requests}">
                        <i class="fas fa-tools me-1"></i> Solicitudes
                    </a>
                </li>

            </ul>

            <div class="d-flex align-items-center gap-3">
                <span class="text-white-50 small">
                    <i class="fas fa-user-circle me-1"></i>
                    <sec:authentication property="name"/>
                </span>
                <a th:href="@{/profile/password}" class="btn btn-sm btn-outline-light px-3">
                    <i class="fas fa-key me-1"></i> Contraseña
                </a>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-light px-3">
                        <i class="fas fa-sign-out-alt me-1"></i> Salir
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
