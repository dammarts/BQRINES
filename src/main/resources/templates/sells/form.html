<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Venta | BQRINES</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-content container-fluid">

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="page-header">
        <h2><i class="fas fa-shopping-cart me-2"></i>Registrar Venta</h2>
        <a th:href="@{/sells}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i>Volver
        </a>
    </div>

    <div class="form-card">
        <form th:action="@{/sells/save}" th:object="${sell}" method="post" id="sellForm">

            <!-- Hidden product id -->
            <input type="hidden" id="productId" name="productId">

            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label">Nombre del cliente</label>
                    <input type="text" th:field="*{clientName}" class="form-control"
                           placeholder="Juan Pérez" required maxlength="150">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Tipo de producto</label>
                    <select id="productType" name="productType" class="form-select" required onchange="toggleProduct()">
                        <option value="">-- Seleccionar tipo --</option>
                        <option value="vehicle">Vehículo</option>
                        <option value="spares">Repuesto</option>
                    </select>
                </div>

                <!-- Vehicle selector -->
                <div class="col-md-6" id="vehicleGroup" style="display:none;">
                    <label class="form-label">Vehículo</label>
                    <select id="vehicleSelect" class="form-select" onchange="syncProduct(this)">
                        <option value="">-- Seleccionar vehículo --</option>
                        <option th:each="v : ${vehicles}"
                                th:value="${v.id}"
                                th:text="${v.brand + ' ' + v.model + ' ' + v.year + ' — Stock: ' + v.stock}"
                                th:attr="data-price=${v.price},data-stock=${v.stock}">
                        </option>
                    </select>
                </div>

                <!-- Spare selector -->
                <div class="col-md-6" id="spareGroup" style="display:none;">
                    <label class="form-label">Repuesto</label>
                    <select id="spareSelect" class="form-select" onchange="syncProduct(this)">
                        <option value="">-- Seleccionar repuesto --</option>
                        <option th:each="s : ${spares}"
                                th:value="${s.id}"
                                th:text="${s.name + ' (' + s.reference + ') — Stock: ' + s.stock}"
                                th:attr="data-price=${s.price},data-stock=${s.stock}">
                        </option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Precio unitario ($)</label>
                    <input type="number" id="unitaryPrice" name="unitaryPrice"
                           class="form-control" placeholder="0.00"
                           min="0" step="0.01" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Cantidad</label>
                    <input type="number" th:field="*{quantity}"
                           class="form-control" placeholder="1"
                           min="1" required oninput="updateTotal()">
                </div>

                <div class="col-12">
                    <div class="p-3 rounded border bg-light d-flex justify-content-between align-items-center">
                        <span class="text-muted">Total estimado</span>
                        <span id="totalDisplay" class="fw-bold fs-5" style="color:var(--bq-primary)">$0</span>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary px-4" id="submitBtn" disabled>
                    <i class="fas fa-save me-2"></i>Confirmar Venta
                </button>
                <a th:href="@{/sells}" class="btn btn-outline-secondary px-4">Cancelar</a>
            </div>
        </form>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function toggleProduct() {
    const type = document.getElementById('productType').value;
    document.getElementById('vehicleGroup').style.display = (type === 'vehicle') ? '' : 'none';
    document.getElementById('spareGroup').style.display  = (type === 'spares')  ? '' : 'none';
    document.getElementById('vehicleSelect').value = '';
    document.getElementById('spareSelect').value  = '';
    document.getElementById('productId').value    = '';
    document.getElementById('unitaryPrice').value = '';
    document.getElementById('totalDisplay').textContent = '$0';
    const qtyInput = document.querySelector('[name="quantity"]');
    qtyInput.removeAttribute('max');
    qtyInput.value = '';
    checkSubmit();
}

function syncProduct(sel) {
    const opt = sel.options[sel.selectedIndex];
    document.getElementById('productId').value = opt.value;
    if (opt.dataset.price) {
        document.getElementById('unitaryPrice').value = opt.dataset.price;
    }
    const qtyInput = document.querySelector('[name="quantity"]');
    if (opt.dataset.stock) {
        qtyInput.max = opt.dataset.stock;
        if (parseInt(qtyInput.value) > parseInt(opt.dataset.stock)) {
            qtyInput.value = opt.dataset.stock;
        }
    }
    updateTotal();
    checkSubmit();
}

function updateTotal() {
    const price = parseFloat(document.getElementById('unitaryPrice').value) || 0;
    const qty   = parseInt(document.querySelector('[name="quantity"]').value) || 0;
    document.getElementById('totalDisplay').textContent = '$' + (price * qty).toLocaleString('es-CO');
    checkSubmit();
}

function checkSubmit() {
    const type    = document.getElementById('productType').value;
    const pid     = document.getElementById('productId').value;
    const price   = document.getElementById('unitaryPrice').value;
    const qty     = document.querySelector('[name="quantity"]').value;
    const client  = document.querySelector('[name="clientName"]').value;
    document.getElementById('submitBtn').disabled = !(type && pid && price && qty && client);
}
</script>
</body>
</html>
