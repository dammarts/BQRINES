<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket de Venta | BQRINES</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-content container-fluid">

    <div class="page-header">
        <h2><i class="fas fa-file-invoice me-2"></i>Comprobante de Venta</h2>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary" onclick="window.print()">
                <i class="fas fa-print me-1"></i>Imprimir
            </button>
            <a th:href="@{/sells}" class="btn btn-primary">
                <i class="fas fa-list me-1"></i>Ver todas las ventas
            </a>
        </div>
    </div>

    <div class="voucher-card">
        <div class="voucher-header">
            <div style="color: var(--bq-accent); font-size: 1.6rem; font-weight: 800; letter-spacing: 2px;">BQRINES</div>
            <div class="text-muted small">Comprobante de Venta</div>
            <div class="mt-2 text-muted small">
                <i class="fas fa-calendar me-1"></i>
                <span th:text="${#temporals.format(sell.date, 'dd/MM/yyyy HH:mm')}"></span>
            </div>
            <div class="mt-1">
                <span class="badge bg-success">
                    <i class="fas fa-check me-1"></i>Venta #<span th:text="${sell.id}"></span>
                </span>
            </div>
        </div>

        <div class="voucher-row">
            <span class="text-muted">Cliente</span>
            <span class="fw-semibold" th:text="${sell.clientName}"></span>
        </div>
        <div class="voucher-row">
            <span class="text-muted">Producto</span>
            <span th:text="${sell.productName}"></span>
        </div>
        <div class="voucher-row">
            <span class="text-muted">Tipo</span>
            <span th:if="${sell.productType == 'vehicle'}" class="badge bg-primary-subtle text-primary">Vehículo</span>
            <span th:if="${sell.productType == 'spares'}"  class="badge bg-warning-subtle text-warning-emphasis">Repuesto</span>
        </div>
        <div class="voucher-row">
            <span class="text-muted">Cantidad</span>
            <span th:text="${sell.quantity}"></span>
        </div>
        <div class="voucher-row">
            <span class="text-muted">Precio unitario</span>
            <span th:text="'$' + ${#numbers.formatDecimal(sell.unitaryPrice, 0, 'COMMA', 0, 'POINT')}"></span>
        </div>
        <div class="voucher-row mt-3 pt-2" style="border-top: 2px solid #dee2e6;">
            <span class="fw-bold">TOTAL</span>
            <span class="voucher-total" th:text="'$' + ${#numbers.formatDecimal(sell.total, 0, 'COMMA', 0, 'POINT')}"></span>
        </div>

        <div class="mt-4 pt-3 border-top text-muted small text-center">
            <i class="fas fa-user me-1"></i>Registrado por: <span th:text="${sell.registeredBy}"></span>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
