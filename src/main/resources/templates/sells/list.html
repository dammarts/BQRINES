<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas | BQRINES</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-content container-fluid">

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show mb-3" role="alert">
        <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="page-header">
        <h2><i class="fas fa-receipt me-2"></i>Historial de Ventas</h2>
        <a th:href="@{/sells/new}" class="btn btn-primary">
            <i class="fas fa-plus me-1"></i>Nueva Venta
        </a>
    </div>

    <div class="table-card">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Productos</th>
                        <th>Total</th>
                        <th>Registrado por</th>
                        <th>Ticket</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(sells)}">
                        <td colspan="7" class="text-center text-muted py-5">
                            <i class="fas fa-receipt fa-2x mb-2 d-block opacity-25"></i>
                            No hay ventas registradas.
                        </td>
                    </tr>
                    <tr th:each="s : ${sells}">
                        <td class="text-muted small" th:text="${s.id}"></td>
                        <td class="small" th:text="${#temporals.format(s.date, 'dd/MM/yyyy HH:mm')}"></td>
                        <td class="fw-semibold" th:text="${s.clientName}"></td>
                        <td>
                            <span th:if="${#lists.isEmpty(s.items)}" class="text-muted small">—</span>
                            <span th:unless="${#lists.isEmpty(s.items)}"
                                  th:text="${#lists.size(s.items)} + ' producto(s)'"></span>
                        </td>
                        <td class="fw-semibold" th:text="'$' + ${#numbers.formatDecimal(s.total, 0, 'COMMA', 0, 'POINT')}"></td>
                        <td class="small text-muted" th:text="${s.registeredBy}"></td>
                        <td>
                            <a th:href="@{/sells/voucher/{id}(id=${s.id})}"
                               class="btn btn-sm btn-outline-secondary">
                                <i class="fas fa-file-invoice"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
