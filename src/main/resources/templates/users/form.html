<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${user.id == null} ? 'Nuevo Usuario' : 'Editar Usuario'">Usuario | BQRINES</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-content container-fluid">

    <div class="page-header">
        <h2>
            <i class="fas fa-user me-2"></i>
            <span th:text="${user.id == null} ? 'Nuevo Usuario' : 'Editar Usuario'"></span>
        </h2>
        <a th:href="@{/users}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i>Volver
        </a>
    </div>

    <div class="form-card">
        <form th:action="${user.id == null} ? @{/users/save} : @{/users/update/{id}(id=${user.id})}"
              th:object="${user}" method="post">

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nombre completo</label>
                    <input type="text" th:field="*{name}" class="form-control"
                           placeholder="Ana García" required maxlength="100">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" th:field="*{email}" class="form-control"
                           placeholder="ana@bqrines.com" required maxlength="150">
                </div>
                <div class="col-md-6">
                    <label class="form-label">
                        Contraseña
                        <span th:if="${user.id != null}" class="text-muted small">(dejar vacío para no cambiar)</span>
                    </label>
                    <input type="password" name="password" class="form-control"
                           placeholder="••••••••"
                           th:required="${user.id == null}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Rol</label>
                    <select th:field="*{rol}" class="form-select" required>
                        <option value="">-- Seleccionar rol --</option>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                    </select>
                </div>
                <div class="col-md-6" th:if="${user.id != null}">
                    <label class="form-label">Estado</label>
                    <div class="form-check form-switch mt-2">
                        <input class="form-check-input" type="checkbox" th:field="*{active}" id="activeCheck">
                        <label class="form-check-label" for="activeCheck">Usuario activo</label>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary px-4">
                    <i class="fas fa-save me-2"></i>
                    <span th:text="${user.id == null} ? 'Crear Usuario' : 'Actualizar'"></span>
                </button>
                <a th:href="@{/users}" class="btn btn-outline-secondary px-4">Cancelar</a>
            </div>
        </form>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
