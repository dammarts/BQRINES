<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios | BQRINES</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-content container-fluid">

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show mb-3" role="alert">
        <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="page-header">
        <h2><i class="fas fa-users me-2"></i>Gestión de Usuarios</h2>
        <a th:href="@{/users/new}" class="btn btn-primary">
            <i class="fas fa-user-plus me-1"></i>Nuevo Usuario
        </a>
    </div>

    <div class="table-card">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="6" class="text-center text-muted py-5">
                            <i class="fas fa-users fa-2x mb-2 d-block opacity-25"></i>
                            No hay usuarios registrados.
                        </td>
                    </tr>
                    <tr th:each="u : ${users}">
                        <td class="text-muted small" th:text="${u.id}"></td>
                        <td class="fw-semibold" th:text="${u.name}"></td>
                        <td class="small" th:text="${u.email}"></td>
                        <td>
                            <span th:if="${u.rol.name() == 'GERENTE'}"         class="role-badge role-gerente" th:text="${u.rol}"></span>
                            <span th:if="${u.rol.name() == 'ASESOR_COMERCIAL'}" class="role-badge role-asesor"  th:text="${u.rol}"></span>
                            <span th:if="${u.rol.name() == 'SERVICIO_TECNICO'}" class="role-badge role-tecnico" th:text="${u.rol}"></span>
                        </td>
                        <td>
                            <span th:if="${u.active}"    class="badge bg-success-subtle text-success">Activo</span>
                            <span th:unless="${u.active}" class="badge bg-danger-subtle text-danger">Inactivo</span>
                        </td>
                        <td>
                            <a th:href="@{/users/edit/{id}(id=${u.id})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                <i class="fas fa-pen"></i>
                            </a>
                            <a th:href="@{/users/delete/{id}(id=${u.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('¿Eliminar este usuario?')">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
