<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Solicitud | BQRINES</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-content container-fluid">

    <div class="page-header">
        <h2><i class="fas fa-tools me-2"></i>Nueva Solicitud de Servicio</h2>
        <a th:href="@{/service-requests}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i>Volver
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="form-card">
                <form th:action="@{/service-requests/save}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Título <span class="text-danger">*</span></label>
                        <input type="text" name="title" class="form-control"
                               placeholder="Ej: Cambio de aceite, revisión de frenos..." required maxlength="200">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Descripción</label>
                        <textarea name="description" class="form-control" rows="4"
                                  placeholder="Detalle lo que necesitas o el problema encontrado..."
                                  maxlength="1000"></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="fas fa-paper-plane me-2"></i>Enviar solicitud
                        </button>
                        <a th:href="@{/service-requests}" class="btn btn-outline-secondary px-4">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
