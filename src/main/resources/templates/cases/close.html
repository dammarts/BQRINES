<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerrar Caso #<span th:text="${sc.id}"></span> | BQRINES</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-content container" style="max-width:900px;">

    <div class="page-header">
        <h2><i class="fas fa-cash-register me-2"></i>Cerrar Caso #<span th:text="${sc.id}"></span> — Generar Factura</h2>
        <a th:href="@{/cases/{id}(id=${sc.id})}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i>Volver
        </a>
    </div>

    <!-- Case summary -->
    <div class="card p-3 mb-4 border-primary">
        <div class="row">
            <div class="col-md-4">
                <span class="fw-bold">Vehículo:</span>
                <span class="badge bg-dark ms-1" th:text="${sc.serviceVehicle.placa}"></span>
                <span class="text-muted small ms-1"
                      th:text="${sc.serviceVehicle.brand + ' ' + sc.serviceVehicle.model}"></span>
            </div>
            <div class="col-md-4">
                <span class="fw-bold">Cliente:</span>
                <span class="ms-1" th:text="${sc.serviceVehicle.client.name}"></span>
            </div>
            <div class="col-md-4">
                <span class="fw-bold">Creado:</span>
                <span class="ms-1 text-muted small"
                      th:text="${#temporals.format(sc.createdAt,'dd/MM/yyyy')}"></span>
            </div>
        </div>
    </div>

    <form th:action="@{/cases/{id}/close(id=${sc.id})}" method="post" id="closeForm">

        <!-- Buyer info -->
        <div class="card p-3 mb-4">
            <h6 class="fw-bold mb-3"><i class="fas fa-user me-1 text-primary"></i>Datos del cobro</h6>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Nombre del cliente <span class="text-danger">*</span></label>
                    <input type="text" name="clientName" class="form-control" required
                           th:value="${sc.serviceVehicle.client.name}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Documento</label>
                    <input type="text" name="buyerDocument" class="form-control"
                           th:value="${sc.serviceVehicle.client.document}">
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Observaciones de cierre</label>
                    <input type="text" name="asorNotes" class="form-control"
                           placeholder="Notas finales del asesor (opcional)">
                </div>
            </div>
        </div>

        <!-- Items table (hidden inputs + display) -->
        <div class="card p-3 mb-4">
            <h6 class="fw-bold mb-3"><i class="fas fa-list me-1 text-primary"></i>Líneas de la factura</h6>
            <div id="itemsContainer">
                <!-- Pre-filled from approved case items -->
                <div th:each="item, i : ${sc.items}"
                     th:if="${item.status.name() == 'DISPONIBLE' or item.status.name() == 'ENTREGADO'}"
                     class="row g-2 align-items-center mb-2 item-row">
                    <input type="hidden" name="itemProductType" value="spares">
                    <input type="hidden" name="itemProductId" th:value="${item.spareId}">
                    <div class="col-md-5">
                        <input type="text" name="itemProductName" class="form-control form-control-sm"
                               th:value="${item.spareName}" readonly>
                    </div>
                    <div class="col-md-2">
                        <input type="number" name="itemQuantity" class="form-control form-control-sm item-qty"
                               th:value="${item.requestedQuantity}" min="1">
                    </div>
                    <div class="col-md-2">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text">$</span>
                            <input type="number" name="itemUnitaryPrice" class="form-control item-price"
                                   step="0.01" th:value="${item.unitaryPrice}" readonly>
                        </div>
                    </div>
                    <div class="col-md-2 text-end fw-semibold subtotal-display">
                        $<span th:text="${#numbers.formatDecimal(item.unitaryPrice * item.requestedQuantity,1,'COMMA',0,'POINT')}"></span>
                    </div>
                </div>
            </div>

            <!-- Labor charge pre-loaded from technician (if set) -->
            <div th:if="${sc.laborPrice != null and sc.laborPrice > 0}"
                 class="row g-2 align-items-center mb-2 item-row border-start border-warning border-3 ps-2">
                <input type="hidden" name="itemProductType" value="extra">
                <input type="hidden" name="itemProductId" value="0">
                <div class="col-md-5">
                    <input type="text" name="itemProductName" class="form-control form-control-sm"
                           th:value="${sc.laborDescription != null and !sc.laborDescription.isEmpty()} ? sc.laborDescription : 'Mano de obra'">
                    <div class="form-text text-warning-emphasis small">Cargado por el técnico</div>
                </div>
                <div class="col-md-2">
                    <input type="number" name="itemQuantity" class="form-control form-control-sm item-qty"
                           value="1" min="1">
                </div>
                <div class="col-md-2">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text">$</span>
                        <input type="number" name="itemUnitaryPrice" class="form-control item-price"
                               step="0.01" th:value="${sc.laborPrice}">
                    </div>
                </div>
                <div class="col-md-2 text-end fw-semibold subtotal-display">
                    $<span th:text="${#numbers.formatDecimal(sc.laborPrice,1,'COMMA',0,'POINT')}"></span>
                </div>
                <div class="col-auto">
                    <span class="badge bg-warning text-dark"><i class="fas fa-hard-hat me-1"></i>Labor</span>
                </div>
            </div>

            <!-- Extra charges row (labor, etc.) -->
            <div id="extraRows"></div>
            <button type="button" class="btn btn-sm btn-outline-secondary mt-2" onclick="addExtra()">
                <i class="fas fa-plus me-1"></i>Agregar cargo extra
            </button>
        </div>

        <!-- Total -->
        <div class="card p-3 mb-4 text-end">
            <span class="fw-bold fs-5">Total: $<span id="totalDisplay">0</span></span>
        </div>

        <div class="d-flex gap-2 justify-content-end">
            <a th:href="@{/cases/{id}(id=${sc.id})}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-success btn-lg">
                <i class="fas fa-check me-2"></i>Confirmar y cerrar caso
            </button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function addExtra() {
    const container = document.getElementById('extraRows');
    const row = document.createElement('div');
    row.className = 'row g-2 align-items-center mb-2 item-row';
    row.innerHTML = `
        <input type="hidden" name="itemProductType" value="extra">
        <input type="hidden" name="itemProductId" value="0">
        <div class="col-md-5">
            <input type="text" name="itemProductName" class="form-control form-control-sm"
                   placeholder="Descripción (ej: Mano de obra)" required>
        </div>
        <div class="col-md-2">
            <input type="number" name="itemQuantity" class="form-control form-control-sm item-qty"
                   value="1" min="1">
        </div>
        <div class="col-md-2">
            <div class="input-group input-group-sm">
                <span class="input-group-text">$</span>
                <input type="number" name="itemUnitaryPrice" class="form-control item-price"
                       step="0.01" placeholder="0.00" oninput="recalcTotal()">
            </div>
        </div>
        <div class="col-md-2 text-end fw-semibold subtotal-display">$0</div>
        <div class="col-auto">
            <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.item-row').remove(); recalcTotal();">
                <i class="fas fa-trash"></i>
            </button>
        </div>`;
    container.appendChild(row);
    row.querySelectorAll('.item-qty,.item-price').forEach(el => el.addEventListener('input', recalcTotal));
}

function recalcTotal() {
    let total = 0;
    document.querySelectorAll('.item-row').forEach(row => {
        const qty = parseFloat(row.querySelector('.item-qty')?.value || 0);
        const price = parseFloat(row.querySelector('.item-price')?.value || 0);
        const sub = qty * price;
        const disp = row.querySelector('.subtotal-display');
        if (disp) disp.textContent = '$' + sub.toLocaleString('es-CO');
        total += sub;
    });
    document.getElementById('totalDisplay').textContent = total.toLocaleString('es-CO');
}

document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.item-qty,.item-price').forEach(el => el.addEventListener('input', recalcTotal));
    recalcTotal();
});
</script>
</body>
</html>
