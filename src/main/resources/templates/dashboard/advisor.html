<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Asesor | BQRINES</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-content container-fluid">

    <div class="page-header">
        <h2><i class="fas fa-tachometer-alt me-2"></i>Mi Panel</h2>
        <div class="d-flex gap-2">
            <a th:href="@{/cases}" class="btn btn-outline-primary">
                <i class="fas fa-clipboard-list me-1"></i>Casos
                <span th:if="${pendingItems > 0}"
                      class="badge bg-warning text-dark ms-1" th:text="${pendingItems}"></span>
            </a>
            <a th:href="@{/sells/new}" class="btn btn-primary">
                <i class="fas fa-plus me-1"></i>Nueva Venta
            </a>
        </div>
    </div>

    <div class="row g-4">
        <!-- Active vehicles -->
        <div class="col-lg-6">
            <div class="table-card">
                <div class="table-card-header">
                    <span class="fw-semibold"><i class="fas fa-car me-2 text-primary"></i>Vehículos disponibles</span>
                    <span class="badge bg-primary rounded-pill" th:text="${#lists.size(activeVehicles)}">0</span>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Vehículo</th>
                                <th>Año</th>
                                <th>Precio</th>
                                <th>Stock</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(activeVehicles)}">
                                <td colspan="4" class="text-center text-muted py-4">Sin vehículos disponibles</td>
                            </tr>
                            <tr th:each="v : ${activeVehicles}">
                                <td th:text="${v.brand + ' ' + v.model}"></td>
                                <td th:text="${v.year}"></td>
                                <td th:text="'$' + ${#numbers.formatDecimal(v.price, 0, 'COMMA', 0, 'POINT')}"></td>
                                <td>
                                    <span th:classappend="${v.stock <= 3} ? 'stock-low' : 'stock-ok'"
                                          th:text="${v.stock} + ' uds.'"></span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Active spares -->
        <div class="col-lg-6">
            <div class="table-card">
                <div class="table-card-header">
                    <span class="fw-semibold"><i class="fas fa-cog me-2 text-warning"></i>Repuestos disponibles</span>
                    <span class="badge bg-warning text-dark rounded-pill" th:text="${#lists.size(activeSpares)}">0</span>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Categoría</th>
                                <th>Precio</th>
                                <th>Stock</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(activeSpares)}">
                                <td colspan="4" class="text-center text-muted py-4">Sin repuestos disponibles</td>
                            </tr>
                            <tr th:each="s : ${activeSpares}">
                                <td th:text="${s.name}"></td>
                                <td><span class="badge bg-light text-dark" th:text="${s.category}"></span></td>
                                <td th:text="'$' + ${#numbers.formatDecimal(s.price, 0, 'COMMA', 0, 'POINT')}"></td>
                                <td>
                                    <span th:classappend="${s.stock <= 3} ? 'stock-low' : 'stock-ok'"
                                          th:text="${s.stock} + ' uds.'"></span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
