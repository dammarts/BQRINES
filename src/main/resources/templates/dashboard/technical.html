<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Técnico | BQRINES</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-content container-fluid">

    <div class="page-header">
        <h2><i class="fas fa-screwdriver-wrench me-2"></i>Repuestos disponibles</h2>
        <a th:href="@{/service-requests/new}" class="btn btn-primary">
            <i class="fas fa-plus me-1"></i>Nueva Solicitud
        </a>
    </div>

    <div class="table-card">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Referencia</th>
                        <th>Categoría</th>
                        <th>Precio unitario</th>
                        <th>Stock</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(activeSpares)}">
                        <td colspan="5" class="text-center text-muted py-5">
                            <i class="fas fa-box-open fa-2x mb-2 d-block opacity-25"></i>
                            No hay repuestos activos en este momento.
                        </td>
                    </tr>
                    <tr th:each="s : ${activeSpares}">
                        <td class="fw-semibold" th:text="${s.name}"></td>
                        <td><code th:text="${s.reference}"></code></td>
                        <td><span class="badge bg-light text-dark" th:text="${s.category}"></span></td>
                        <td th:text="'$' + ${#numbers.formatDecimal(s.price, 0, 'COMMA', 0, 'POINT')}"></td>
                        <td>
                            <span th:classappend="${s.stock <= 3} ? 'stock-low' : 'stock-ok'"
                                  th:text="${s.stock} + ' uds.'"></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
