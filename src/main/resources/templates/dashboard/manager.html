<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Gerente | BQRINES</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Toast container for stock-alert.js -->
<div id="stock-alert-container" style="position:fixed;top:70px;right:1rem;z-index:1055;width:320px;"></div>

<div class="main-content container-fluid">

    <!-- Stat cards -->
    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-lg-3">
            <a th:href="@{/inventory/vehicles}" class="text-decoration-none">
                <div class="stat-card stat-card-link">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div class="stat-number" th:text="${totalVehicles}">0</div>
                            <div class="stat-label">Vehículos en inventario</div>
                        </div>
                        <i class="fas fa-car stat-icon"></i>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-sm-6 col-lg-3">
            <a th:href="@{/inventory/spares}" class="text-decoration-none">
                <div class="stat-card accent stat-card-link">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div class="stat-number" th:text="${totalSpares}">0</div>
                            <div class="stat-label">Repuestos en inventario</div>
                        </div>
                        <i class="fas fa-cog stat-icon"></i>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-sm-6 col-lg-3">
            <a th:href="@{/sells}" class="text-decoration-none">
                <div class="stat-card success stat-card-link">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div class="stat-number" th:text="${totalSells}">0</div>
                            <div class="stat-label">Ventas registradas</div>
                        </div>
                        <i class="fas fa-receipt stat-icon"></i>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-sm-6 col-lg-3">
            <a th:href="@{/inventory/spares}" class="text-decoration-none">
                <div class="stat-card danger stat-card-link">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div class="stat-number" th:text="${totalAlerts}">0</div>
                            <div class="stat-label">Alertas de stock bajo</div>
                        </div>
                        <i class="fas fa-triangle-exclamation stat-icon"></i>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-sm-6 col-lg-3">
            <a th:href="@{/cases}" class="text-decoration-none">
                <div class="stat-card stat-card-link" style="background:linear-gradient(135deg,#0d6efd 0%,#0dcaf0 100%);">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <div class="stat-number" th:text="${openCases}">0</div>
                            <div class="stat-label">Casos activos</div>
                        </div>
                        <i class="fas fa-clipboard-list stat-icon"></i>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <!-- Alerts section -->
    <div th:if="${totalAlerts > 0}" class="row g-3 mb-4">
        <div class="col-12">
            <div class="alert-banner">
                <div class="fw-semibold mb-2">
                    <i class="fas fa-bell me-2 text-warning"></i>
                    Repuestos con stock bajo o agotado
                </div>
                <ul class="list-unstyled mb-0">
                    <li th:each="s : ${spareAlerts}" class="d-flex justify-content-between py-1 border-bottom border-warning-subtle">
                        <span th:text="${s.name + ' (' + s.reference + ')'}"></span>
                        <span th:if="${s.stock == 0}" class="stock-off ms-2">0 uds.</span>
                        <span th:if="${s.stock > 0}" class="stock-low ms-2" th:text="${s.stock} + ' uds.'"></span>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Quick actions -->
    <div class="page-header">
        <h2><i class="fas fa-bolt me-2"></i>Acciones rápidas</h2>
    </div>
    <div class="row g-3">
        <div class="col-6 col-md-3">
            <a th:href="@{/inventory/vehicles/new}" class="btn btn-primary w-100 py-3">
                <i class="fas fa-plus me-2"></i>Nuevo Vehículo
            </a>
        </div>
        <div class="col-6 col-md-3">
            <a th:href="@{/inventory/spares/new}" class="btn btn-primary w-100 py-3">
                <i class="fas fa-plus me-2"></i>Nuevo Repuesto
            </a>
        </div>
        <div class="col-6 col-md-3">
            <a th:href="@{/sells/new}" class="btn btn-outline-secondary w-100 py-3">
                <i class="fas fa-shopping-cart me-2"></i>Registrar Venta
            </a>
        </div>
        <div class="col-6 col-md-3">
            <a th:href="@{/reports}" class="btn btn-outline-secondary w-100 py-3">
                <i class="fas fa-chart-line me-2"></i>Ver Reportes
            </a>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/stock-alert.js}"></script>
</body>
</html>
