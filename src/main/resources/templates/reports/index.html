<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes | BQRINES</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-content container-fluid">

    <div class="page-header">
        <h2><i class="fas fa-chart-bar me-2"></i>Reportes de Ventas</h2>
    </div>

    <!-- Low-stock alerts -->
    <div th:if="${totalAlerts > 0}" class="alert-banner mb-4">
        <span class="fw-semibold"><i class="fas fa-bell me-2 text-warning"></i>
            <span th:text="${totalAlerts}"></span> repuesto(s) con stock bajo o agotado
        </span>
        <div class="row g-3 mt-1">
            <div class="col-md-6" th:if="${not #lists.isEmpty(spareAlerts)}">
                <p class="fw-semibold small mb-1 text-muted">REPUESTOS</p>
                <ul class="list-unstyled mb-0">
                    <li th:each="s : ${spareAlerts}" class="d-flex justify-content-between py-1">
                        <span th:text="${s.name}"></span>
                        <span th:if="${s.stock == 0}" class="stock-off" th:text="${s.stock} + ' uds.'"></span>
                        <span th:if="${s.stock > 0}" class="stock-low" th:text="${s.stock} + ' uds.'"></span>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Date filter -->
    <div class="form-card mb-4" style="max-width:100%;">
        <form th:action="@{/reports/filter}" method="get" class="row g-3 align-items-end">
            <div class="col-md-4">
                <label class="form-label">Desde</label>
                <input type="datetime-local" name="start" class="form-control"
                       th:value="${start != null} ? ${#temporals.format(start, 'yyyy-MM-dd''T''HH:mm')} : ''">
            </div>
            <div class="col-md-4">
                <label class="form-label">Hasta</label>
                <input type="datetime-local" name="end" class="form-control"
                       th:value="${end != null} ? ${#temporals.format(end, 'yyyy-MM-dd''T''HH:mm')} : ''">
            </div>
            <div class="col-md-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary flex-fill">
                    <i class="fas fa-filter me-1"></i>Filtrar
                </button>
                <a th:href="@{/reports}" class="btn btn-outline-secondary">
                    <i class="fas fa-rotate-left"></i>
                </a>
            </div>
        </form>
        <div class="d-flex gap-2 mt-3">
            <a id="exportPdf" th:href="@{/reports/export/pdf}" class="btn btn-outline-danger btn-sm">
                <i class="fas fa-file-pdf me-1"></i>Exportar PDF
            </a>
            <a id="exportExcel" th:href="@{/reports/export/excel}" class="btn btn-outline-success btn-sm">
                <i class="fas fa-file-excel me-1"></i>Exportar Excel
            </a>
        </div>
    </div>

    <!-- Summary when filtered -->
    <div th:if="${start != null}" class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="stat-card success">
                <div class="stat-number" th:text="${#lists.size(sells)}">0</div>
                <div class="stat-label">Ventas en el período</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card accent">
                <div class="stat-number"
                     th:text="'$' + ${#numbers.formatDecimal(sells.stream().mapToDouble(s -> s.total).sum(), 0, 'COMMA', 0, 'POINT')}">$0</div>
                <div class="stat-label">Total facturado</div>
            </div>
        </div>
    </div>

    <!-- Sells table -->
    <div class="table-card">
        <div class="table-card-header">
            <span class="fw-semibold">
                <span th:if="${start != null}">
                    Ventas del <span th:text="${#temporals.format(start,'dd/MM/yyyy HH:mm')}"></span>
                    al <span th:text="${#temporals.format(end,'dd/MM/yyyy HH:mm')}"></span>
                </span>
                <span th:unless="${start != null}">Todas las ventas</span>
            </span>
            <span class="badge bg-primary rounded-pill" th:text="${#lists.size(sells)}">0</span>
        </div>
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Identificación</th>
                        <th>Productos</th>
                        <th>Total</th>
                        <th>Registrado por</th>
                        <th>Comprobante</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(sells)}">
                        <td colspan="8" class="text-center text-muted py-5">
                            <i class="fas fa-chart-bar fa-2x mb-2 d-block opacity-25"></i>
                            No hay ventas en este período.
                        </td>
                    </tr>
                    <tr th:each="s : ${sells}">
                        <td class="text-muted small" th:text="${s.id}"></td>
                        <td class="small" th:text="${#temporals.format(s.date, 'dd/MM/yyyy HH:mm')}"></td>
                        <td class="fw-semibold" th:text="${s.clientName}"></td>
                        <td class="small text-muted" th:text="${s.buyerDocument != null and !#strings.isEmpty(s.buyerDocument)} ? ${s.buyerDocument} : '—'"></td>
                        <td>
                            <span th:if="${#lists.isEmpty(s.items)}" class="text-muted small">—</span>
                            <div th:each="item : ${s.items}" class="d-flex align-items-center gap-1 mb-1">
                                <span th:if="${item.productType == 'vehicle'}" class="badge bg-primary-subtle text-primary" style="font-size:.65rem;">V</span>
                                <span th:if="${item.productType == 'spares'}"  class="badge bg-warning-subtle text-warning-emphasis" style="font-size:.65rem;">R</span>
                                <span th:if="${item.productType == 'extra'}"   class="badge bg-secondary-subtle text-secondary" style="font-size:.65rem;">E</span>
                                <span class="small" th:text="${item.productName}"></span>
                                <span class="text-muted small">× <span th:text="${item.quantity}"></span></span>
                            </div>
                        </td>
                        <td class="fw-semibold" th:text="'$' + ${#numbers.formatDecimal(s.total, 0, 'COMMA', 0, 'POINT')}"></td>
                        <td class="small text-muted" th:text="${s.registeredBy}"></td>
                        <td>
                            <a th:href="@{/sells/voucher/{id}(id=${s.id})}"
                               class="btn btn-sm btn-outline-secondary">
                                <i class="fas fa-file-invoice"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Keep export links in sync with current filter inputs
function syncExportLinks() {
    const start = document.querySelector('input[name="start"]').value;
    const end   = document.querySelector('input[name="end"]').value;
    ['exportPdf', 'exportExcel'].forEach(function(id) {
        const el = document.getElementById(id);
        const base = el.href.split('?')[0];
        el.href = base + (start && end ? '?start=' + start + '&end=' + end : '');
    });
}
document.querySelectorAll('input[type="datetime-local"]').forEach(function(el) {
    el.addEventListener('change', syncExportLinks);
});
syncExportLinks();
</script>
</body>
</html>
