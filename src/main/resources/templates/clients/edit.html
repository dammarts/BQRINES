<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cliente | BQRINES</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="main-content container" style="max-width:600px;">

    <div class="page-header">
        <h2><i class="fas fa-user-edit me-2"></i>Editar Cliente</h2>
        <a th:href="@{/clients}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i>Volver
        </a>
    </div>

    <form th:action="@{/clients/update/{id}(id=${client.id})}" method="post" class="card p-4">
        <div class="row g-3">
            <div class="col-12">
                <label class="form-label fw-semibold">Nombre completo <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control" required
                       maxlength="150" th:value="${client.name}">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Documento</label>
                <input type="text" name="document" class="form-control"
                       maxlength="50" th:value="${client.document}">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Teléfono</label>
                <input type="text" name="phone" class="form-control"
                       maxlength="20" th:value="${client.phone}">
            </div>
            <div class="col-12">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" name="email" class="form-control"
                       maxlength="150" th:value="${client.email}">
            </div>
        </div>

        <div class="mt-3">
            <h6 class="text-muted">Vehículos registrados</h6>
            <div th:if="${#lists.isEmpty(client.vehicles)}" class="text-muted small">Ninguno</div>
            <span th:each="v : ${client.vehicles}"
                  class="badge bg-secondary me-1 fs-6"
                  th:text="${v.placa + ' · ' + v.brand + ' ' + v.model}"></span>
        </div>

        <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-1"></i>Guardar cambios
            </button>
            <a th:href="@{/clients}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
